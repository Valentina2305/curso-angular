<mat-nav-list>
  <ng-container *ngFor="let item of menuItems">
    <a mat-list-item [routerLink]="item.path" routerLinkActive="active" *ngIf="!item.adminOnly || isAdmin">
      <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
      <span matListItemTitle>{{ item.label }}</span>
    </a>
  </ng-container>
</mat-nav-list>
