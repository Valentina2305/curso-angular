<mat-card>
  <mat-card-header>
    <mat-card-title>Lista de Inscripciones</mat-card-title>
    <button mat-raised-button color="primary" (click)="agregarInscripcion()">
      <mat-icon>add</mat-icon> Agregar Inscripción
    </button>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let inscripcion">{{ inscripcion.id }}</td>
      </ng-container>

      <ng-container matColumnDef="alumno">
        <th mat-header-cell *matHeaderCellDef>Alumno</th>
        <td mat-cell *matCellDef="let inscripcion">{{ inscripcion.alumnoNombre }}</td>
      </ng-container>

      <ng-container matColumnDef="curso">
        <th mat-header-cell *matHeaderCellDef>Curso</th>
        <td mat-cell *matCellDef="let inscripcion">{{ inscripcion.cursoNombre }}</td>
      </ng-container>

      <ng-container matColumnDef="fechaInscripcion">
        <th mat-header-cell *matHeaderCellDef>Fecha Inscripción</th>
        <td mat-cell *matCellDef="let inscripcion">{{ inscripcion.fechaInscripcion | date:'dd/MM/yyyy' }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let inscripcion">
          <span [ngClass]="'estado-' + inscripcion.estado">{{ inscripcion.estado }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let inscripcion">
          <button mat-icon-button color="primary" (click)="editarInscripcion(inscripcion.id)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="eliminarInscripcion(inscripcion.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
